<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#16a34a" />
    <title>Farmotic — Hors-ligne</title>
    <style>
      :root {
        color-scheme: light;
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 24px;
        background: #f9fafb;
        color: #1f2937;
        font-family: 'Inter', ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif;
      }
      .carte {
        width: 100%;
        max-width: 420px;
        border-radius: 20px;
        border: 1px solid #e5e7eb;
        background: #ffffff;
        padding: 28px 24px;
        text-align: center;
        box-shadow: 0 12px 30px rgba(16, 24, 20, 0.06);
      }
      .logo {
        width: 56px;
        height: 56px;
        margin: 0 auto 16px;
        border-radius: 16px;
        background: #16a34a;
        color: #ffffff;
        font-size: 28px;
        font-weight: 800;
        display: flex;
        align-items: center;
        justify-content: center;
      }
      h1 {
        margin: 0 0 8px;
        font-size: 20px;
        letter-spacing: -0.01em;
      }
      p {
        margin: 0;
        font-size: 14px;
        line-height: 1.6;
        color: #4b5563;
      }
      button {
        margin-top: 20px;
        border: 0;
        border-radius: 12px;
        background: #275a3c;
        color: #ffffff;
        font-size: 14px;
        font-weight: 600;
        padding: 11px 18px;
        cursor: pointer;
      }
      .astuce {
        margin-top: 14px;
        font-size: 12px;
        color: #6b7280;
      }
    </style>
  </head>
  <body>
    <main class="carte">
      <div class="logo" aria-hidden="true">F</div>
      <h1>Vous êtes hors-ligne</h1>
      <p>
        Les données en cache restent consultables. Rétablissez la connexion pour
        enregistrer de nouveaux relevés, charges ou ventes.
      </p>
      <button type="button" onclick="window.location.reload()">Réessayer</button>
      <p class="astuce">
        Si Farmotic est déjà installé, ouvrez l’application : les pages déjà
        visitées restent accessibles.
      </p>
    </main>
  </body>
</html>
